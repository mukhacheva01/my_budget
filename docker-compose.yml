services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: budget_app
    ports:
      - "5433:5432"
    volumes:
      - budget_pgdata:/var/lib/postgresql/data

volumes:
  budget_pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
          POSTGRES_DB: budget_app_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeCheck API
        run: npx tsc --noEmit --project packages/api/tsconfig.json

      - name: TypeCheck Web
        run: npx tsc --noEmit --project packages/web/tsconfig.json

      - name: Lint
        run: npm run lint --if-present

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://money:money@localhost:5433/budget_app_test?schema=public
          DEV_MODE: 'true'
          AUTH_SECRET: ci-test-secret-1234567890
        run: |
          npx prisma migrate deploy --schema packages/api/prisma/schema.prisma
          npm test --workspaces --if-present

      - name: Build
        run: npm run build

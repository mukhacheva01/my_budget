services:
  - type: web
    name: budget-app-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run db:generate && npx prisma migrate deploy --schema packages/api/prisma/schema.prisma && npm run build --workspace=@money/api
    startCommand: node packages/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_MODE
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: budget-app-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: budget-app-bot
    runtime: node
    buildCommand: npm ci && npm run build --workspace=@money/bot
    startCommand: node packages/bot/dist/index.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false

  - type: web
    name: budget-app-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=@money/web
    staticPublishPath: packages/web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: budget-app-db
    plan: free
    databaseName: budget_app
    user: money
